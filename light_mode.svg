<!-- ═══════════════════ PC CALLIGRAPHIC CREST CARD ═══════════════════ -->
<defs>
  <linearGradient id="pcGradL" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0969da"/>
    <stop offset="50%" stop-color="#0550ae"/>
    <stop offset="100%" stop-color="#8250df"/>
  </linearGradient>
  <linearGradient id="pcGradLH" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0969da"/>
    <stop offset="50%" stop-color="#0550ae"/>
    <stop offset="100%" stop-color="#8250df"/>
  </linearGradient>
  <radialGradient id="haloGradL" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0969da" stop-opacity="0.10"/>
    <stop offset="60%" stop-color="#8250df" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
  </radialGradient>
  <filter id="glowFxL" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="subtleGlowL" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

