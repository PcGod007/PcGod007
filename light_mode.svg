<polyline points="60,112 36,112 36,136" fill="none" stroke="url(#pcGradL)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
<!-- Corner bracket accents (top-right) -->
<polyline points="443,112 466,112 466,136" fill="none" stroke="url(#pcGradL)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
