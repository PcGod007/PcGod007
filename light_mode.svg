<ellipse cx="251" cy="440" rx="95" ry="115" fill="#8250df" opacity="0.04"/>

<!-- Big Pc — deep glow halo -->
<text x="251" y="530" text-anchor="middle"
      font-family="ConsolasFallback,Consolas,monospace" font-size="250" font-weight="bold"
      fill="url(#pcGradL)" opacity="0.12" filter="url(#glowFxL)">Pc</text>

<!-- Big Pc — soft outer glow -->
<text x="251" y="530" text-anchor="middle"
      font-family="ConsolasFallback,Consolas,monospace" font-size="250" font-weight="bold"
      fill="url(#pcGradL)" opacity="0.25" filter="url(#subtleGlowL)">Pc</text>

<!-- Big Pc — crisp main layer -->
<text x="251" y="530" text-anchor="middle"
      font-family="ConsolasFallback,Consolas,monospace" font-size="250" font-weight="bold"
      fill="url(#pcGradL)">Pc</text>

<!-- Horizontal accent line under Pc -->
<rect x="106" y="572" width="290" height="1.5" rx="1" fill="url(#pcGradLH)" opacity="0.55"/>

<!-- Username label -->
<text x="251" y="612" text-anchor="middle"
      font-family="ConsolasFallback,Consolas,monospace" font-size="18" fill="#57606a" letter-spacing="5">PcGod007</text>

<!-- Decorative dot row -->
<g fill="url(#pcGradL)">
  <circle cx="191" cy="754" r="2.5" opacity="0.4"/>
  <circle cx="211" cy="754" r="2.5" opacity="0.4"/>
  <circle cx="231" cy="754" r="2.5" opacity="0.4"/>
  <circle cx="251" cy="754" r="4.5" opacity="0.9"/>
  <circle cx="271" cy="754" r="2.5" opacity="0.4"/>
  <circle cx="291" cy="754" r="2.5" opacity="0.4"/>
  <circle cx="311" cy="754" r="2.5" opacity="0.4"/>
</g>

<!-- Animated scan line -->
<rect x="20" y="90" width="462" height="2" fill="url(#pcGradLH)" opacity="0.08">
  <animate attributeName="y" values="90;818;90" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.08;0.01;0.08" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- Top-right micro badge: ❯ prompt -->
<text x="448" y="68" text-anchor="end" font-family="ConsolasFallback,Consolas,monospace" font-size="13" fill="#1a7f37" opacity="0.7">❯</text>
