<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1200px" height="850px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #8250df;}
.value {fill: #0550ae;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.cc {fill: #57606a;}
text, tspan {white-space: pre;}
</style>
<rect width="1200px" height="850px" fill="#f6f8fa"/>

<!-- ═══════════════════ Pc LOGO CARD ═══════════════════ -->
<defs>
  <linearGradient id="pcGradL" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0550ae"/>
    <stop offset="100%" stop-color="#8250df"/>
  </linearGradient>
  <linearGradient id="pcGradLH" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0550ae"/>
    <stop offset="100%" stop-color="#8250df"/>
  </linearGradient>
  <filter id="glowFxL" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="subtleGlowL" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Card shadow -->
<rect x="26" y="42" width="462" height="784" rx="18" ry="18" fill="#afb8c1" opacity="0.3"/>

<!-- Main card body -->
<rect x="20" y="36" width="462" height="784" rx="18" ry="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Terminal header bar -->
<rect x="20" y="36" width="462" height="54" rx="18" ry="18" fill="#f6f8fa"/>
<rect x="20" y="66" width="462" height="24" fill="#f6f8fa"/>

