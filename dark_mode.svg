<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1200px" height="850px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #d2a8ff;}
.value {fill: #79c0ff;}
.addColor {fill: #3fb950;}
.delColor {fill: #f85149;}
.cc {fill: #8b949e;}
text, tspan {white-space: pre;}
</style>
<rect width="1200px" height="850px" fill="#0d1117"/>

<!-- ═══════════════════ PC CALLIGRAPHIC CREST CARD ═══════════════════ -->
<defs>
  <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="50%" stop-color="#79c0ff"/>
    <stop offset="100%" stop-color="#d2a8ff"/>
  </linearGradient>
  <linearGradient id="pcGradH" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="50%" stop-color="#79c0ff"/>
    <stop offset="100%" stop-color="#d2a8ff"/>
  </linearGradient>
  <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.12"/>
    <stop offset="60%" stop-color="#d2a8ff" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glowFx" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

